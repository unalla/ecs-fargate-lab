# The pinned base image. CI builds FROM exactly this digest.
#
# The base-refresh workflow watches the upstream tag and, when the digest
# moves, opens a PR that changes this one line. That PR runs the full test
# suite before anything reaches AWS.
#
# Seed it once with the current digest:
#   docker buildx imagetools inspect python:3.12-slim --format '{{.Manifest.Digest}}'
#
BASE_IMAGE_TAG=python:3.12-slim
BASE_IMAGE_DIGEST=sha256:REPLACE_ME_ON_FIRST_RUN
